<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>T.R. Fox — The room builds itself</title>
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#0a0a0a; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0a0a0a; }
      #wA, #wB { position:absolute; inset:0; }
      #wB { opacity:0; }
      video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
      #flash { position:absolute; inset:0; background:#fff; opacity:0; }
      #black { position:absolute; inset:0; background:#0a0a0a; opacity:1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.3" data-width="1080" data-height="1920">
      <div id="wA"><video id="vA" class="clip" data-start="0" data-duration="10.4" data-media-start="0" data-track-index="0" src="assets/video/source.mp4" muted playsinline></video></div>
      <div id="wB"><video id="vB" class="clip" data-start="10.2" data-duration="6.1" data-media-start="10.8" data-track-index="1" src="assets/video/source.mp4" muted playsinline></video></div>
      <div id="flash"></div>
      <div id="black"></div>
      <audio id="music" data-start="0.00" data-duration="16.3" data-track-index="2" data-volume="0.55" src="assets/music/bed.mp3"></audio>
      <audio id="open" data-start="0.10" data-duration="0.5" data-track-index="3" data-volume="0.5" src="assets/sfx/impactSoft_heavy_003.ogg"></audio>
      <audio id="riser" data-start="0.50" data-duration="1.5" data-track-index="4" data-volume="0.45" src="assets/sfx/riser.wav"></audio>
      <audio id="hit0" data-start="2.00" data-duration="0.3" data-track-index="5" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="wh1" data-start="3.55" data-duration="0.7" data-track-index="6" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
      <audio id="hit1" data-start="4.00" data-duration="0.3" data-track-index="7" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="wh2" data-start="5.55" data-duration="0.7" data-track-index="8" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
      <audio id="hit2" data-start="6.00" data-duration="0.3" data-track-index="9" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="wh3" data-start="7.55" data-duration="0.7" data-track-index="10" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
      <audio id="hit3" data-start="8.00" data-duration="0.3" data-track-index="11" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="wh4" data-start="11.04" data-duration="0.7" data-track-index="12" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
      <audio id="hit4" data-start="11.49" data-duration="0.3" data-track-index="13" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="wh5" data-start="14.04" data-duration="0.7" data-track-index="14" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
      <audio id="hit5" data-start="14.49" data-duration="0.3" data-track-index="15" data-volume="0.75" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sting" data-start="14.49" data-duration="0.6" data-track-index="16" data-volume="0.6" src="assets/sfx/impactSoft_heavy_003.ogg"></audio>
      <audio id="bong" data-start="14.60" data-duration="0.3" data-track-index="17" data-volume="0.45" src="assets/sfx/bong_001.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#black", { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      // hide the mid-scrub jump (src 10.4 -> 10.8) with a short crossfade; beat-grid: 10.2s
      tl.to("#wB", { opacity: 1, duration: 0.2, ease: "none" }, 10.2);
      // soft light pulse on every label change, landing with the impact hit
      const CH = [2.0, 4.0, 6.0, 8.0, 11.49, 14.49];
      CH.forEach((t) => {
        tl.to("#flash", { opacity: 0.14, duration: 0.06, ease: "power1.out" }, t - 0.02);
        tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });
      tl.to("#black", { opacity: 1, duration: 0.5, ease: "power2.in" }, 15.8);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
